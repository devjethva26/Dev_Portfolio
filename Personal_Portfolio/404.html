<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404: Page Not Found | Dev Jethva</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .error-box {
      width: 100%;
      max-width: 480px;
      padding: 3.5rem 2rem;
      border-radius: 20px;
    }

    .error-code {
      font-size: 5.5rem;
      font-weight: 800;
      font-family: var(--font-mono);
      line-height: 1;
      margin-bottom: 0.8rem;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.8rem;
    }

    .error-description {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body class="admin-body">

  <div class="glow-sphere glow-1" aria-hidden="true"></div>
  <div class="glow-sphere glow-2" aria-hidden="true"></div>

  <div class="error-page-wrapper">
    <div class="error-box glass-panel reveal active">
      <div class="error-code gradient-text">404</div>
      <h1 class="error-title">Page Lost in Space</h1>
      <p class="error-description">
        The route you are looking for has either been moved, soft-deleted into the recycle bin, or never existed in the database.
      </p>
    </div>
  </div>

  <script>
    const savedTheme = localStorage.getItem('dev_portfolio_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
